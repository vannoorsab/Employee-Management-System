spring.application.name=employee-management-system
server.port=8080

# MySQL connection. The database "ems_db" is created automatically if it does not exist.
# Set DB_USERNAME and DB_PASSWORD as environment variables (defaults below are for local development only).
spring.datasource.url=jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate creates/updates the "employees" table from the Employee entity.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dates are returned as "2024-06-01", not as numbers.
spring.jackson.serialization.write-dates-as-timestamps=false
